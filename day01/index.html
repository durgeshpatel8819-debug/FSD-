<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>ABES ENG COLLEGE</h1>
    <h3>B.TECH Programme</h3>
    <h4>STUDENT INFORMATION :</h4>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" title="Enter your name"><br><br>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" placeholder="Enter roll number" title="Enter roll number"><br><br>

        <label for="email">Email ID:</label>
        <input type="email" id="email" placeholder="Enter your Email ID" title="Enter your Email ID"><br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" placeholder="Enter your mobile number" title="Enter your mobile number"><br><br>

        <label>Choose a Course:</label><br>
        <input type="radio" id="cse" name="course" value="B.Tech CSE" title="Select B.Tech CSE">
        <label for="cse">B.Tech CSE</label><br>

        <input type="radio" id="it" name="course" value="B.Tech IT" title="Select B.Tech IT">
        <label for="it">B.Tech IT</label><br>

        <input type="radio" id="ece" name="course" value="B.Tech ECE" title="Select B.Tech ECE">
        <label for="ece">B.Tech ECE</label><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male" title="Select Male gender">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="Female" title="Select Female gender">
        <label for="female">Female</label><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" placeholder="Enter address" title="Enter address"></textarea>
        <br><br>

        <button type="submit" id="btn">Submit</button>
        <button type="submit" id="btn1">Reset</button>
    </form>

</body>
</html>
