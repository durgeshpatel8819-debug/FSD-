<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="index.css">

</head>

<body>

    <div id="studentHeading">

        <h1 id="student">Student Management System</h1>

        <div id="studentdetails">

            <form id="studentForm">

                <div class="input-group">

                    <label for="name">Name:</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                    <label for="roll_number">Roll No.:</label>

                    <input
                        type="number"
                        id="roll_number"
                        placeholder="Enter your Roll Number"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="course">Course:</label>

                    <input
                        type="text"
                        id="course"
                        placeholder="Enter your course"
                        required
                    >

                    <label for="marks">Marks:</label>

                    <input
                        type="number"
                        id="marks"
                        placeholder="Enter your marks"
                        min="0"
                        max="100"
                        required
                    >

                </div>


                <button type="submit" id="addButton">
                    Add Student
                </button>

            </form>


            <hr>


            <div class="search-section">

                <label for="nameRollNumber">
                    Search Student:
                </label>

                <input
                    type="text"
                    id="nameRollNumber"
                    placeholder="Search by Name or Roll No."
                >

            </div>


            <div class="student-stats">

                <div class="input-group">

                    <label for="total_students">
                        Total Students:
                    </label>

                    <input
                        type="number"
                        id="total_students"
                        readonly
                    >

                    <label for="average_marks">
                        Average Marks:
                    </label>

                    <input
                        type="number"
                        id="average_marks"
                        readonly
                    >

                </div>

            </div>


            <div id="studentList">

                <table>

                    <thead>

                        <tr>

                            <th>Roll Number</th>

                            <th>Name</th>

                            <th>Course</th>

                            <th>Marks</th>

                            <th>Grade</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="studentTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="index.js"></script>

</body>

</html>
